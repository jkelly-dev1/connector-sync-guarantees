name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # This repository has no runtime dependencies at all. There is no
      # container, no database, no service and no network: the whole thing is
      # a simulation in one Python process. CI installs pytest and runs
      # everything, including the experiments themselves if it wants to; they
      # finish in under a minute and reproduce byte for byte.
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10"

      - run: python -m pytest -q

      # Regenerate the evidence and refuse any diff.
      #
      # Of the suite, 35 test functions assert over results/*.json, which are
      # committed artifacts. Without this step a change to the simulation, the
      # connector or an experiment script leaves every one of those tests
      # reading the old file and passing, so the suite reports green on code
      # that no longer produces the published numbers. The invariants have
      # teeth only against a fresh run, and this step performs one.
      #
      # That count is checked by
      # tests/test_documented_claims.py::test_the_ci_comment_counts_the_result_backed_tests_correctly
      # rather than maintained by hand, because it had already drifted once.
      #
      # This is cheap because the whole thing is deterministic: no clock, no
      # network, no container, a seeded world, and all four experiments finish
      # in about five seconds reproducing byte for byte.
      - name: Experiments regenerate the shipped results exactly
        run: |
          for s in exp1_rate_limits exp2_incremental_loss \
                   exp3_webhooks_vs_polling exp4_reconciliation; do
            python scripts/$s.py > /dev/null
          done
          git diff --exit-code results/

      # Every number in the README is re-derived from results/*.json and must
      # appear verbatim. A re-run that shifts a figure fails here rather than
      # leaving the document silently wrong.
      - name: README numbers match the shipped results
        run: python scripts/check_readme_numbers.py

      # SAMPLE_RUN.md says every command in it "was executed exactly as
      # written" and that "no output below was altered". A transcript is
      # believed for longer than a table, because a reader who would re-check
      # a figure will not re-run a captured session, so it is re-run here.
      - name: SAMPLE_RUN.md matches what the commands print
        run: python scripts/check_sample_run.py
